name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  repo-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install runner dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync ripgrep

      - name: Run repository consistency checks
        run: bash ./scripts/check-repo-consistency.sh

  agent-audit:
    runs-on: ubuntu-24.04
    needs: repo-consistency
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install runner dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml ripgrep

      - name: Run shared-agent audit
        run: bash ./scripts/audit-codex-agents.sh

  release-bundle-dry-run:
    runs-on: ubuntu-24.04
    needs:
      - repo-consistency
      - agent-audit
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install runner dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync ripgrep

      - name: Build release bundle
        run: bash ./scripts/build-release-bundle.sh --output-dir dist --version "ci-${GITHUB_RUN_NUMBER}"

      - name: Upload dry-run release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-cli-bootstrap-ci-bundle
          path: dist/
          if-no-files-found: error

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/tools@ab62f45b2a3067e5a7425d703f7fd07f1618b72c # nddev-cicd-v0.6.14
        with:
          capability: security
      - name: Lint and audit workflows
        run: |
          actionlint
          zizmor --offline --no-progress .github/workflows/ci.yml .github/workflows/security.yml
      - name: Scan new pull request commits, or the full history on main
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then
            gitleaks git --no-banner --redact --log-opts="$BASE..$HEAD" .
          else
            gitleaks git --no-banner --redact .
          fi

