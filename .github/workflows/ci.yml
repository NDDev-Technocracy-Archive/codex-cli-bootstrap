name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions: {}

concurrency:
  group: source-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  source:
    name: Source and bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Prepare source tooling
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@c09f5939b8ca3ef1ddf72d825ff01d751e649292 # v0.6.60
        with:
          managed: 'false'
          fetch-depth: '0'
          python-version: '3.15.2'
          tools: zizmor@1.32.0,shellcheck@0.11.0
          tool-assets: tools/ci-tools.json
          reports: dist
      - name: Check source and build the actual portable bundle
        id: project
        run: just verify
      - name: Complete source and bundle proof
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@c09f5939b8ca3ef1ddf72d825ff01d751e649292 # v0.6.60
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.project.outcome }}
          task: source and bundle
          task-type: build
          name: source-bundle
          reports: dist

  merge-stops:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/merge-stops.yml@c09f5939b8ca3ef1ddf72d825ff01d751e649292 # v0.6.60
    permissions:
      contents: read

  gate:
    name: gate
    needs: [source, merge-stops]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require source, actual bundle and security success
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          STOPS_RESULT: ${{ needs.merge-stops.result }}
        run: test "$SOURCE_RESULT" = success && test "$STOPS_RESULT" = success
